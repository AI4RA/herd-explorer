# Rebuild the data and projections and push the result to the data-refresh branch.
# Run it from the Actions tab after editing pipeline/release.yml for a new survey year (see RELEASING.md),
# or any time to rebuild from the current sources. A person then opens the pull request (the run summary
# links to it) and merges it; nothing is published until then, and publish.yml then uploads the projections.
# Pushing a branch needs only contents: write, so the repository does not have to let Actions create
# pull requests.
name: Refresh data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # Dated package snapshot, so reruns use the same package versions
  R_REPOS: https://packagemanager.posit.co/cran/__linux__/noble/2026-10-01

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240  # the NCSES graduate survey files download slowly
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Install R packages
        run: make packages

      - name: Build the data and check it against NCSES
        run: make data 2>&1 | tee build.log

      - name: Backtest, fit and simulate projections
        run: make model 2>&1 | tee model.log

      - name: Run the publish checks without uploading
        run: make check

      - name: Summarize
        run: |
          {
            echo "Rebuilt by the Refresh data workflow ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            echo '```json'
            cat docs/data/meta.json
            echo '```'
            echo
            echo 'Model selection and backtest (from `make model`):'
            echo '```'
            grep -E "interval widening factor|production model" model.log || true
            echo '```'
            echo
            echo 'What NCSES changed since the last release, rows kept from the archive, and files read from SAS:'
            echo '```'
            grep -E "herd_changes:|kept from the archive|kept it from the archive|reading the SAS file|HERD archive:" build.log || true
            echo '```'
            echo
            echo 'Merging this pull request updates the site and runs publish.yml, which refits and uploads the projections to Hugging Face.'
          } > pr-body.md
          rm model.log build.log

      # The branch has one commit whose message is the summary, so GitHub fills in the pull request's
      # title and description from it when someone opens the pull request
      - name: Push the results to the data-refresh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c data-refresh
          git add docs/data pipeline/archive
          if git diff --cached --quiet; then
            echo "No changes to the data; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          last_year=$(jq -r .last_year docs/data/meta.json)
          { echo "Data refresh: FY $last_year"; echo; cat pr-body.md; } > commit-msg.txt
          git commit -q -F commit-msg.txt
          git push -f origin data-refresh
          url="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...data-refresh?expand=1"
          {
            echo "## Data refresh ready for review"
            echo
            echo "The results are on the data-refresh branch. [Open the pull request]($url), review it and merge it to update the site."
            echo
            cat pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"
